<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- =========================
             HERO SECTION
        ========================== -->

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">
                    PERSONAL FINANCE
                </p>

                <h1>
                    Manage Your
                    <span>Money</span>
                </h1>

                <p class="hero-text">
                    Track your daily expenses, manage your
                    spending and stay in control of your money.
                </p>

            </div>


            <div class="hero-image">

                <img
                    src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=900&q=80"
                    alt="Personal finance"
                >

            </div>

        </section>



        <!-- =========================
             SUMMARY CARDS
        ========================== -->

        <section class="summary">


            <!-- Total Expense -->

            <div class="summary-card">

                <div class="summary-icon">
                    💰
                </div>

                <div>

                    <p class="summary-title">
                        Total Expenses
                    </p>

                    <h2>
                        ₹<span id="totalExpense">0</span>
                    </h2>

                </div>

            </div>


            <!-- Transactions -->

            <div class="summary-card">

                <div class="summary-icon">
                    📊
                </div>

                <div>

                    <p class="summary-title">
                        Transactions
                    </p>

                    <h2 id="transactionCount">
                        0
                    </h2>

                </div>

            </div>


        </section>



        <!-- =========================
             ADD EXPENSE
        ========================== -->

        <section class="card">

            <div class="section-title">

                <div>
                    <span class="section-icon">➕</span>
                    <h2>Add New Expense</h2>
                </div>

            </div>


            <form id="expenseForm">


                <div class="input-group">

                    <label for="expenseName">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="expenseName"
                        placeholder="e.g. Lunch"
                    >

                </div>


                <div class="input-group">

                    <label for="expenseAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="e.g. 250"
                        min="1"
                    >

                </div>


                <div class="input-group">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <select id="expenseCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Travel">
                            ✈️ Travel
                        </option>

                        <option value="Shopping">
                            🛍️ Shopping
                        </option>

                        <option value="Bills">
                            📄 Bills
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="add-btn"
                >
                    Add Expense
                </button>


            </form>

        </section>



        <!-- =========================
             MESSAGE
        ========================== -->

        <p id="message"></p>



        <!-- =========================
             SEARCH & FILTER
        ========================== -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <span class="section-icon">
                        🔎
                    </span>

                    <h2>
                        Find Expenses
                    </h2>

                </div>

            </div>


            <div class="filters">


                <div class="input-group">

                    <label for="searchInput">
                        Search
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by expense name..."
                    >

                </div>


                <div class="input-group">

                    <label for="filterCategory">
                        Category
                    </label>

                    <select id="filterCategory">

                        <option value="All">
                            All Categories
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Travel">
                            ✈️ Travel
                        </option>

                        <option value="Shopping">
                            🛍️ Shopping
                        </option>

                        <option value="Bills">
                            📄 Bills
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


            </div>

        </section>



        <!-- =========================
             EXPENSE LIST
        ========================== -->

        <section class="expenses-section">

            <div class="expenses-header">

                <div>

                    <p class="small-heading">
                        YOUR ACTIVITY
                    </p>

                    <h2>
                        Recent Expenses
                    </h2>

                </div>

            </div>


            <div id="expenseList"></div>

        </section>


    </div>



    <script src="script.js"></script>

</body>

</html>
